name: Deploy to Vercel

on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:
    inputs:
      target:
        description: App to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - admin
          - api

concurrency:
  group: vercel-production-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-db:
    name: Deploy database migrations
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true
      }}
    uses: ./.github/workflows/db-deploy.yml
    with:
      ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
    secrets: inherit

  deploy-web:
    name: Deploy web
    runs-on: ubuntu-22.04
    environment: production
    needs: deploy-db
    if: >-
      ${{
        needs.deploy-db.result == 'success' &&
        (
          github.event_name == 'pull_request' ||
          inputs.target == 'all' ||
          inputs.target == 'web'
        )
      }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - name: Deploy web
        uses: ./.github/actions/deploy-vercel-app
        with:
          app: web
          package: "@pathway/web"
          cwd: apps/web
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}

  deploy-admin:
    name: Deploy admin
    runs-on: ubuntu-22.04
    environment: production
    needs: deploy-db
    if: >-
      ${{
        needs.deploy-db.result == 'success' &&
        (
          github.event_name == 'pull_request' ||
          inputs.target == 'all' ||
          inputs.target == 'admin'
        )
      }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - name: Deploy admin
        uses: ./.github/actions/deploy-vercel-app
        with:
          app: admin
          package: "@pathway/admin"
          cwd: apps/admin
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-22.04
    environment: production
    needs: deploy-db
    if: >-
      ${{
        needs.deploy-db.result == 'success' &&
        (
          github.event_name == 'pull_request' ||
          inputs.target == 'all' ||
          inputs.target == 'api'
        )
      }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - name: Deploy API
        uses: ./.github/actions/deploy-vercel-app
        with:
          app: api
          package: "@pathway/api"
          cwd: apps/api
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
