name: Scheduled workers

on:
  workflow_dispatch:
  schedule:
    # Nightly at 02:30 UTC. Keep this as GitHub Actions cron to avoid Render cron charges.
    - cron: "30 2 * * *"

jobs:
  run:
    name: AV30, outbox and retention
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AV30_TENANT_IDS: ${{ secrets.AV30_TENANT_IDS }}
      REPORT_BUNDLE_TENANT_IDS: ${{ secrets.REPORT_BUNDLE_TENANT_IDS }}
      RETENTION_ENABLED: ${{ secrets.RETENTION_ENABLED }}
      OUTBOX_DISPATCH_URL: ${{ secrets.OUTBOX_DISPATCH_URL }}
      OUTBOX_DISPATCH_TOKEN: ${{ secrets.OUTBOX_DISPATCH_TOKEN }}
      BEHAVIOUR_OUTBOX_DISPATCH_URL: ${{ secrets.BEHAVIOUR_OUTBOX_DISPATCH_URL }}
      BEHAVIOUR_OUTBOX_SECRET: ${{ secrets.BEHAVIOUR_OUTBOX_SECRET }}
      FINANCE_STATEMENT_MONTH_END_URL: ${{ secrets.FINANCE_STATEMENT_MONTH_END_URL }}
      FINANCE_STATEMENT_MONTH_END_SECRET: ${{ secrets.FINANCE_STATEMENT_MONTH_END_SECRET }}
      FINANCE_STATEMENT_OUTBOX_DISPATCH_URL: ${{ secrets.FINANCE_STATEMENT_OUTBOX_DISPATCH_URL }}
      FINANCE_STATEMENT_OUTBOX_SECRET: ${{ secrets.FINANCE_STATEMENT_OUTBOX_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_STORAGE_PRIVATE_BUCKET: ${{ secrets.SUPABASE_STORAGE_PRIVATE_BUCKET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || {
            echo "DATABASE_URL secret is required for worker jobs." >&2
            exit 1
          }
          test "$RETENTION_ENABLED" = "true" || {
            echo "RETENTION_ENABLED must be set to true for scheduled retention." >&2
            exit 1
          }
          test -n "$SUPABASE_URL" || {
            echo "SUPABASE_URL secret is required for report bundles." >&2
            exit 1
          }
          test -n "$SUPABASE_SECRET_KEY" || {
            echo "SUPABASE_SECRET_KEY secret is required for report bundles." >&2
            exit 1
          }
          test -n "$SUPABASE_STORAGE_PRIVATE_BUCKET" || {
            echo "SUPABASE_STORAGE_PRIVATE_BUCKET secret is required for report bundles." >&2
            exit 1
          }
          test -n "$OUTBOX_DISPATCH_URL" || { echo "OUTBOX_DISPATCH_URL secret is required for outbox dispatch." >&2; exit 1; }
          test -n "$BEHAVIOUR_OUTBOX_DISPATCH_URL" || { echo "BEHAVIOUR_OUTBOX_DISPATCH_URL secret is required for behaviour notification dispatch." >&2; exit 1; }
          test -n "$BEHAVIOUR_OUTBOX_SECRET" || { echo "BEHAVIOUR_OUTBOX_SECRET is required for behaviour notification dispatch." >&2; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Compute AV30
        run: pnpm --filter @pathway/workers compute:av30

      - name: Generate report bundles
        run: pnpm --filter @pathway/workers generate:report-bundle

      - name: Dispatch outbox events
        run: pnpm --filter @pathway/workers outbox:dispatch

      - name: Generate closed-month Finance statements
        if: ${{ env.FINANCE_STATEMENT_MONTH_END_URL != '' && env.FINANCE_STATEMENT_MONTH_END_SECRET != '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=Europe/London date +%d)" != "01" ]]; then
            echo "Skipping Finance month-end outside the first London calendar day."
            exit 0
          fi
          pnpm --filter @pathway/workers finance:statements:month-end

      - name: Dispatch Finance statement notices
        if: ${{ env.FINANCE_STATEMENT_OUTBOX_DISPATCH_URL != '' && env.FINANCE_STATEMENT_OUTBOX_SECRET != '' }}
        run: pnpm --filter @pathway/workers outbox:dispatch-finance-statements

      - name: Run retention
        run: pnpm --filter @pathway/workers retention:run
