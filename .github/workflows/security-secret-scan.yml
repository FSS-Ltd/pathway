name: Secret scan

on:
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
