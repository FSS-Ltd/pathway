name: Post-deploy smoke tests

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL, for example https://api.nexsteps.dev
        required: true
        type: string
      web_url:
        description: Marketing site URL, for example https://nexsteps.dev
        required: true
        type: string
      admin_url:
        description: Exact admin deployment URL, for example https://nexsteps-admin-abc123.vercel.app
        required: true
        type: string

jobs:
  smoke:
    name: Smoke test deployed apps
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check API health
        shell: bash
        run: |
          set -euo pipefail
          url="${{ inputs.api_url }}/health"
          response="$(curl --fail --silent --show-error --location --max-time 20 "$url")"
          echo "$response"
          echo "$response" | grep -E '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Check marketing site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            --output /tmp/nexsteps-web.html \
            "${{ inputs.web_url }}"
          test -s /tmp/nexsteps-web.html

      - name: Check admin app responds
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          ADMIN_DEPLOYMENT_URL: ${{ inputs.admin_url }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@54.13.0 curl / \
            --deployment "$ADMIN_DEPLOYMENT_URL" \
            --non-interactive -- \
            --silent --show-error --max-time 20 \
            --dump-header /tmp/nexsteps-admin-headers.txt \
            --output /tmp/nexsteps-admin-response.txt
          grep -Eiq '^HTTP/[^ ]+ 307' /tmp/nexsteps-admin-headers.txt
          grep -Eiq '^location: https://accounts\.nexsteps\.dev/sign-in([?\r]|$)' \
            /tmp/nexsteps-admin-headers.txt
