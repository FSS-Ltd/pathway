name: Private message Broadcast provider

on:
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-broadcast:
    name: Private message Broadcast and request counts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify against an isolated Supabase provider
        run: bash apps/api/scripts/realtime-provider/run.sh
