name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  api-serverless-runtime:
    name: API serverless artifact (Node 24, 1024 descriptors)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_api_bundle_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_api_bundle_test
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathway_api_bundle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build API
        run: pnpm --filter @pathway/api build

      - name: Test isolated artifact with a 1024 descriptor limit
        shell: bash
        run: |
          ulimit -n 1024
          pnpm --filter @pathway/api test:serverless

      - name: Verify finance PDF generation with the real renderer
        run: pnpm --filter @pathway/api test:finance-pdf

  ci:
    name: Typecheck, Lint & Unit Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-ci-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-ci-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm -r typecheck
        continue-on-error: false

      - name: Lint
        run: pnpm -r lint
        continue-on-error: false

      - name: Test (Unit) - db
        timeout-minutes: 5
        run: pnpm --filter @pathway/db test:unit

      - name: Test (Unit) - util
        timeout-minutes: 5
        run: pnpm --filter @pathway/util test:unit

      - name: Test (Unit) - auth
        timeout-minutes: 5
        run: pnpm --filter @pathway/auth test:unit

      - name: Test (Unit) - platform
        timeout-minutes: 5
        run: pnpm --filter @pathway/platform test:unit

      - name: Test (Unit) - workers
        timeout-minutes: 5
        run: pnpm --filter @pathway/workers test:unit

      - name: Test (Unit) - admin
        timeout-minutes: 5
        run: pnpm --filter @pathway/admin test:unit

      - name: Test (Unit) - web
        timeout-minutes: 5
        run: pnpm --filter @pathway/web test:unit

      - name: Test (Unit) - nexsteps-home
        timeout-minutes: 5
        run: pnpm --filter @pathway/nexsteps-home test:unit

      - name: Test (Unit) - api
        timeout-minutes: 8
        run: pnpm --filter @pathway/api test:unit

  integration:
    name: Integration Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: ci # Ensure unit tests and linting pass first
    # Allow the expanded shard and the separate one-connection database check.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_OPTIONS: --max-old-space-size=5120

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pathway_test_user
          POSTGRES_PASSWORD: pathway_test_password
          POSTGRES_DB: pathway_test_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-integration-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-integration-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Create e2e test database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: pathway_test_user
          PGPASSWORD: pathway_test_password
        run: |
          # Create the e2e database if it doesn't exist
          psql -c "CREATE DATABASE pathway_test_e2e;" || true

      - name: Build API dependencies
        run: pnpm exec turbo run build --filter='@pathway/api^...'

      - name: Run integration tests
        env:
          # Jest's global setup resets, migrates, and seeds the database once.
          E2E_USE_GLOBAL_SETUP: "true"
          E2E_RLS_ROLE: pathway_e2e_rls
          E2E_TENANT_RLS_ROLE: pathway_e2e_tenant_rls
          E2E_DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_test_e2e?schema=app
          E2E_BOOTSTRAP_DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_test_e2e?schema=app
          E2E_ORG_ID: "00000000-0000-0000-0000-000000000001"
          E2E_TENANT_ID: "00000000-0000-0000-0000-00000000000a"
          E2E_TENANT2_ID: "00000000-0000-0000-0000-00000000000b"
          E2E_TENANT_SLUG: "e2e-tenant-a"
          E2E_ALLOW_RESET: "false"
        run: pnpm --filter @pathway/api test:integration --shard=${{ matrix.shard }}/2
        continue-on-error: false

      - name: Create one-connection test database
        if: matrix.shard == 1
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: pathway_test_user
          PGPASSWORD: pathway_test_password
        run: psql -c "CREATE DATABASE pathway_test_one_connection;"

      - name: Verify request transactions with one database connection
        if: matrix.shard == 1
        env:
          E2E_USE_GLOBAL_SETUP: "true"
          E2E_RLS_ROLE: pathway_e2e_rls
          E2E_TENANT_RLS_ROLE: pathway_e2e_tenant_rls
          E2E_DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_test_one_connection?schema=app&connection_limit=1
          E2E_BOOTSTRAP_DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_test_one_connection?schema=app&connection_limit=1
          E2E_ORG_ID: "00000000-0000-0000-0000-000000000001"
          E2E_TENANT_ID: "00000000-0000-0000-0000-00000000000a"
          E2E_TENANT2_ID: "00000000-0000-0000-0000-00000000000b"
          E2E_TENANT_SLUG: "e2e-tenant-a"
          E2E_ALLOW_RESET: "false"
        run: >-
          pnpm --filter @pathway/api test:integration --runTestsByPath
          src/concerns/tests/concerns.e2e.spec.ts
          src/access-control/tests/effective-permissions.tenant-rls.e2e.spec.ts

  finance-backup-restore:
    name: Finance Backup Restore
    runs-on: ubuntu-22.04
    needs: ci
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathway_finance_backup_source
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Create empty restore target
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: createdb pathway_finance_backup_target

      - name: Apply current migrations to the source database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_finance_backup_source?schema=app
        run: pnpm db:deploy

      - name: Test backup restore safety guards
        run: >-
          node --test
          scripts/finance-backup-restore-smoke.test.mjs
          scripts/lib/finance-production-env.test.mjs

      - name: Dump and restore synthetic Finance data
        env:
          NODE_ENV: test
          FINANCE_BACKUP_RESTORE_PG_CLIENT_IMAGE: postgres:16-alpine
          FINANCE_BACKUP_RESTORE_DISPOSABLE_TOKEN: finance-backup-restore-disposable-databases
          FINANCE_BACKUP_RESTORE_SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_finance_backup_source?schema=app
          FINANCE_BACKUP_RESTORE_TARGET_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_finance_backup_target?schema=app
        run: node scripts/finance-backup-restore-smoke.mjs

  system-role-seed-proof:
    name: System Role Seed Database Identity
    runs-on: ubuntu-22.04
    needs: ci
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathway_system_role_seed_test_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_system_role_seed_test_ci?schema=app
        run: pnpm db:deploy

      - name: Prove system-role seed database identity
        env:
          SYSTEM_ROLE_SEED_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_system_role_seed_test_ci?schema=app
          SYSTEM_ROLE_SEED_TEST_DISPOSABLE_TOKEN: provision-and-drop-system-role-seed-test-logins
          PATHWAY_RUN_DB_INTEGRATION_TESTS: "1"
          PATHWAY_RUN_DB_SEED_PROOF: "1"
          DOTENV_CONFIG_PATH: ../../.env.test
        run: >-
          pnpm --filter @pathway/db exec
          node -r dotenv/config node_modules/jest/bin/jest.js
          --runInBand --runTestsByPath
          src/__tests__/system-role-seed-test-database.spec.ts
          src/__tests__/seed-system-roles.spec.ts
          src/__tests__/system-role-seed-command.spec.ts

  permission-definitions:
    name: Permission Definition Database
    runs-on: ubuntu-22.04
    needs: ci
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathway_permission_definition_smoke_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_permission_definition_smoke_ci?schema=public
        run: pnpm db:deploy

      - name: Run permission-definition database smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_permission_definition_smoke_ci?schema=public
          PATHWAY_RUN_PERMISSION_DEFINITION_DB_SMOKE: "1"
          PATHWAY_PERMISSION_DEFINITION_DB_SMOKE_DESTRUCTIVE_TOKEN: destroy-permission-definitions-in-disposable-database
        run: pnpm --filter @pathway/platform test:unit -- permission-definition-database.integration

      - name: Run production-schema trigger smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pathway_permission_definition_smoke_ci?schema=public
          PATHWAY_RUN_DB_INTEGRATION_TESTS: "1"
        run: >-
          pnpm --filter @pathway/db exec
          jest --config jest.config.ts --runInBand --runTestsByPath
          src/__tests__/role-trigger-schema.integration.spec.ts
          src/__tests__/portable-ace-fact-triggers.integration.spec.ts
          src/__tests__/portable-student-portal-policy.integration.spec.ts
          src/__tests__/portable-ace-actor-membership.integration.spec.ts
          src/__tests__/portable-message-creator.integration.spec.ts
          src/__tests__/portable-message-participant.integration.spec.ts
          src/__tests__/portable-notice-guardian-eligibility.integration.spec.ts
          src/__tests__/portable-notice-author.integration.spec.ts
          src/__tests__/portable-family-discovery-policy.integration.spec.ts
          src/__tests__/public-ace-message-bridge.integration.spec.ts

  organisation-role-rls:
    name: Organisation Role RLS
    runs-on: ubuntu-22.04
    needs: ci
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pathway_test_user
          POSTGRES_PASSWORD: pathway_test_password
          POSTGRES_DB: pathway_role_rls_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run low-privilege organisation role RLS test
        env:
          E2E_USE_GLOBAL_SETUP: "true"
          E2E_ALLOW_RESET: "false"
          E2E_RLS_ROLE: pathway_e2e_rls
          E2E_DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_role_rls_ci?schema=app
          E2E_BOOTSTRAP_DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_role_rls_ci?schema=app
          E2E_ORG_ID: "00000000-0000-0000-0000-000000000001"
          E2E_TENANT_ID: "00000000-0000-0000-0000-00000000000a"
          E2E_TENANT2_ID: "00000000-0000-0000-0000-00000000000b"
        run: pnpm --filter @pathway/api test:integration -- --runInBand access-control.rls role-assignment.rls effective-permissions.rls role-api-transaction.rls

      - name: Run app-schema notice eligibility smoke
        env:
          DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_role_rls_ci?schema=app
          PATHWAY_RUN_DB_INTEGRATION_TESTS: "1"
        run: >-
          pnpm --filter @pathway/db exec
          jest --config jest.config.ts --runInBand --runTestsByPath
          src/__tests__/portable-notice-guardian-eligibility.integration.spec.ts
          src/__tests__/portable-notice-author.integration.spec.ts
          src/__tests__/portable-family-discovery-policy.integration.spec.ts
          src/__tests__/public-ace-message-bridge.integration.spec.ts

      - name: Test organisation role RLS policy gate contract
        run: node --test scripts/lib/role-rls-gate.test.mjs

      - name: Verify organisation role RLS policies
        env:
          E2E_DATABASE_URL: postgresql://pathway_test_user:pathway_test_password@localhost:5432/pathway_role_rls_ci?schema=app
          SUPABASE_RLS_GATE_ACCEPTED: "true"
        run: node scripts/check-supabase-rls.mjs --strict
